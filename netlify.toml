[build]
  command = "npm run build"
  publish = "dist"

# Vite manages NODE_ENV automatically — `vite build` sets it to
# "production" internally. Setting NODE_ENV=production via env var
# or .env file triggers a Vite warning. We intentionally leave it
# unset so Vite controls it.

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
