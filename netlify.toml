[build]
  command = "npm run build"
  publish = "dist"

# Vite manages NODE_ENV automatically — `vite build` sets it to
# "production" internally. Setting NODE_ENV=production via env var
# or .env file triggers a Vite warning. We intentionally leave it
# unset so Vite controls it.

[build.environment]
  NODE_VERSION = "20"

# Global headers — explicit indexing allowance, security, performance.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Sitemaps and feed — never cached aggressively, always fresh.
[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=utf-8"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Explicit headers for PDF documents so they render inline in the
# browser's native PDF viewer and download with the correct filename
# when the user clicks the Download button.
[[headers]]
  for = "/document/*"
  [headers.values]
    Content-Type = "application/pdf"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600"

# SPA fallback — static files are served first (PDFs, sitemap, feed,
# assets). Only unmatched paths fall through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
